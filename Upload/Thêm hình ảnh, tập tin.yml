info:
  name: Thêm hình ảnh, tập tin
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/Upload/Base64/Create"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
  body:
    type: json
    data: |
      {

          "UploadFor":"", // | STORE_IMAGE |  | CUSTOMER_AVATAR | EMPLOYEE_AVATAR | 
        "FileType": "image/jpg", //  "image/png", "image/jpeg", "image/jpg," "application/pdf"
        "ItemId":1, // Id  sản phẩm | Id cửa hàng | ....
        "FileBase64": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
