info:
  name: Webhook nhận kết quả thanh toán Momo
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/ThanhToanMoMo/NhanKetQuaThanhToan"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
    - name: userIdLogin
      value: "182"
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Endpoint này được sử dụng để nhận kết quả thanh toán từ VNPAY.

  #### **Request**

  - **URL:** `{URL}/api/ThanhToanMoMo/NhanKetQuaThanhToan`
      
  - **Method:** `GET`
      

  #### **Parameters (Tham số truy vấn)**

  Các tham số này được gửi qua URL.

  | Trường | Kiểu dữ liệu | Bắt buộc | Ghi chú |
  | `partnerCode` | `string` | Có | Mã đối tác do MoMo cung cấp. |
  | `orderId` | `string` | Có | Mã đơn hàng. |
  | `requestId` | `string` | Có | Mã yêu cầu giao dịch. |
  | `amount` | `double` | Có | Số tiền của giao dịch. |
  | `orderInfo` | `string` | Có | Thông tin chi tiết về giao dịch. |
  | `orderType` | `string` | Có | Loại giao dịch: `momo_wallet`, `PayWithATM`, `PayWithCC`. |
  | `transId` | `string` | Có | Mã giao dịch của MoMo. |
  | `resultCode` | `string` | Không | Mã trạng thái giao dịch (tham khảo [tại đây](https://developers.momo.vn/v3/vi/docs/payment/api/result-handling/resultcode)). |
  | `message` | `string` | Không | Thông báo chi tiết. |
  | `payType` | `string` | Không | Hình thức thanh toán: `App`, `QR`, `Web`. |
  | `responseTime` | `datetime` | Không | Thời gian trạng thái giao dịch. |
  | `extraData` | `string` | Không | Các thông tin bổ sung từ giao dịch. |
  | `signature` | `string` | Không | Chữ ký xác thực dữ liệu, sử dụng thuật toán `Hmac_SHA256`. |

  Xuất sang Trang tính

  #### **Response (Kết quả trả về)**

  Kết quả trả về sẽ là một đối tượng JSON với thông báo tương ứng.

  | Trạng thái | Mã `Success` | `message` |
  | **Thành công** | `"01"` | `"Thanh toán thành công "` |
  | **Thất bại** | `"00"` | `"PartnerCode chưa đúng"` |
  | **Thất bại** | `"00"` | `"Kết quả không hợp lệ"` |
