info:
  name: Lấy danh sách bài viết
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}/Articles/GetAll"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
    - name: userIdLogin
      value: "182"
