      - name: DistrictName
        type: text
        value: ""
      - name: DistrictCode
        type: text
        value: ""
      - name: ZipCode
        type: text
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
