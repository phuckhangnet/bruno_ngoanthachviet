        type: text
        value: 1992-09-09
      - name: Email
        type: text
        value: 2900000000@2900000000.com
      - name: PhoneNumber
        type: text
        value: "2900000001"
      - name: CountryCode
        type: text
        value: VN
      - name: CountryName
        type: text
        value: Việt Nam
        description: "Tên quốc gia "
      - name: CityCode
        type: text
        value: "71"
