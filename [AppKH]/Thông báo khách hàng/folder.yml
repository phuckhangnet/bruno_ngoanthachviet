docs:
  content: |-
    ### **Tài liệu API Socket Notification (SignalR)**

    > Url: **/hubs/notification** 
      

    Key 1:

    **ReceiveNotification: thông báo mới**

    Template type:

    ``` csharp
    {
        // Lịch hẹn
        public const string Appointment = "Appointment";
        // Xác nhận đấu giá
        public const string AuctionConfirm = "AuctionConfirm";
        // Đơn hàng (Cửa hàng đã xác nhận)
        public const string OrderConfirmed = "OrderConfirmed";
        // Lời mời tham gia đấu giá
        public const string AuctionInvitation = "AuctionInvitation";
        // Nạp tiền thành công
        public const string DepositSuccess = "DepositSuccess";
        // Rút tiền thành công
        public const string WithdrawalSuccess = "WithdrawalSuccess";
        // Phiên đấu giá kết thúc
        public const string AuctionEnded = "AuctionEnded";
    }

     ```

    Response:

    | **Trường** | **Kiểu dữ liệu** | **Mô tả** | **Vai trò chính** |  
    | `title` | `string` | Tiêu đề thông báo. | |  
    | `body` | `string` | Nội dung ngắn của thông báo. | |  
    | **`templateType`** | `string` | **Loại thông báo** (VD: `Appointment`, `OrderConfirmed`). | **Phân loại** |  
    | `data` | `string` | Chuỗi JSON chứa dữ liệu chi tiết (ID sự kiện, Mã code, v.v.). | |

    **2\. UpdateNotificationBadge: khi goi api đánh dấu đã đọc tin sẽ trả về tin này cùng response api**

    Response:

    | **Dữ liệu nhận được** | **Kiểu dữ liệu** | **Mô tả** | **Vai trò chính** |  
    | `unreadCount` | `Number` (Integer) | **Tổng số lượng thông báo chưa đọc** còn lại của người dùng. | Cập nhật UI Badge Count |
  type: text/markdown
