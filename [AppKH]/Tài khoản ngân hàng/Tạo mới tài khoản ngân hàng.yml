info:
  name: Tạo mới tài khoản ngân hàng
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/Customers/CreateBankAccount"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
    - name: userIdLogin
      value: "1"
  body:
    type: json
    data: |-
      {
          "BankName":"Thach Viet Bank",
          "BankCode":"NTVBank",
          "AccountNumber":"123456",
          "AccountHolderName":"PHAM VAN HAU"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
