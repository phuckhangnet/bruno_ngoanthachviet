info:
  name: Tìm kiếm sản phẩm nổi bật
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/Products/Trending/Searching"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
          "SearchText":"B4D9B8C9" // Mã sản phẩm, tên sản phẩm
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
