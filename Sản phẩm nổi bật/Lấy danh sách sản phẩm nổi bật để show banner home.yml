info:
  name: Lấy danh sách sản phẩm nổi bật để show banner home
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/Products/Trending/GetAllToShowHome"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
          "ProductAmount":3 // Số lượng sản phẩm
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
